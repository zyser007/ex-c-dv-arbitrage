  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- arbitrage loop arrow -->
  <g fill="none" stroke="#c9a45c" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <path d="M 256 92 A 164 164 0 1 1 110 188"/>
  </g>
  <path d="M 96 150 L 116 196 L 64 192 Z" fill="#c9a45c" opacity="0.85"/>

  <!-- central orb -->
  <circle cx="256" cy="262" r="118" fill="url(#orb)" stroke="#3a2a0a" stroke-width="10"/>
  <ellipse cx="218" cy="216" rx="44" ry="26" fill="#ffffff" opacity="0.5"/>
  <circle cx="298" cy="306" r="14" fill="#fff3c4" opacity="0.45"/>
</svg>
