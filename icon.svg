<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Orb Arbitrage">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#241d15"/>
      <stop offset="100%" stop-color="#0e0c0a"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fff6da"/>
      <stop offset="38%" stop-color="#f2c75a"/>
      <stop offset="78%" stop-color="#c8902a"/>
      <stop offset="100%" stop-color="#6e4d12"/>
